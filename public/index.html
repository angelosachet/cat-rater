<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Rater - Ranking de Fotos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🐱 Cat Rater</h1>
      <p>Vote nas suas fotos favoritas!</p>
    </header>

    <section class="submit-section">
      <h2>Enviar sua foto</h2>
      <p class="submit-help">Envie sua foto e o nome dela. Após aprovação do admin, ela aparecerá no ranking.</p>
      <form id="submissionForm" class="submission-form">
        <input id="submissionName" name="name" type="text" minlength="2" maxlength="60" placeholder="Nome da foto" required>
        <input id="submissionPhoto" name="photo" type="file" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp" required>
        <button type="submit" class="btn btn-primary">Enviar para aprovação</button>
      </form>
      <div id="submissionMessage" class="submission-message" aria-live="polite"></div>
    </section>

    <!-- Grid de fotos -->
    <section class="photos-section">
      <h2>Ranking</h2>
      <div id="photosGrid" class="photos-grid">
        <div class="loading">Carregando fotos...</div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
